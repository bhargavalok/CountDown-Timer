<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountDown-Timer</title>
    <link rel="stylesheet" href="./css/custom.css">
</head>
<body>
<main class="main">
        <div class="overlay">
            <div class="content">
                <p class="eyebrow">COUNTDOWN</p>
                <h1 class="title">We will be back soon!</h1>

                <time class="date" id="end_Date" datetime="2026-10-10T23:59:00">
                    10 October 2026 11:59 PM
                </time>

                <section class="countdown" aria-label="Countdown timer">
                    <div class="countdown-card">
                        <output class="time-value" id="days" aria-label="Days">00</output>
                        <span class="unit">Days</span>
                    </div>

                    <div class="countdown-card">
                        <output class="time-value" id="hours" aria-label="Hours">00</output>
                        <span class="unit">Hours</span>
                    </div>

                    <div class="countdown-card">
                        <output class="time-value" id="minutes" aria-label="Minutes">00</output>
                        <span class="unit">Minutes</span>
                    </div>

                    <div class="countdown-card">
                        <output class="time-value" id="seconds" aria-label="Seconds">00</output>
                        <span class="unit">Seconds</span>
                    </div>
                </section>

                <p class="status" id="countdownStatus" aria-live="polite">
                    Counting down...
                </p>
            </div>
        </div>
    </main>

    <script src="./js/app.js" defer></script>

</body>
</html>
